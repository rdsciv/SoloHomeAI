# SoloHomeAI Workflow Update Routing And Static Hosting

## Action

Follow the update-routing-and-static-hosting workflow:
1. Edit or add static HTML files for affected routes in public/ (e.g., public/app.html, public/dashboard.html).
2. Update vercel.json to declare new redirects or rewrites.
3. Modify React Router usage or navigation logic in src/App.tsx and related page components.
4. Update documentation (README.md) if navigation behavior changes.
5. Adjust package.json or dependencies if routing libraries change.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: public/*.html, public/*/index.html, vercel.json

